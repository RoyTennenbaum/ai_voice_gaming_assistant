[project]
name = "ai-voice-gaming-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.18.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
ingest = "ai_voice_gaming_assistant.data.ingest:main"
app = "ai_voice_gaming_assistant.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

